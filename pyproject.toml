[project]
name = "rag-learning-cloud"
version = "1.0.0"
requires-python = ">=3.12,<3.15"
dependencies = [
  "fastapi>=0.119,<1",
  "uvicorn>=0.37,<1",
  "google-genai>=1.45,<2",
  "qdrant-client>=1.15,<2",
  "pydantic-settings>=2.11,<3",
  "python-multipart>=0.0.20,<1",
  "jinja2>=3.1.6,<4",
  "pypdf>=6.1,<7",
  "python-docx>=1.2,<2",
  "python-pptx>=1.0.2,<2",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=1,<2", "httpx>=0.28,<1"]

[tool.uv]
package = false

[tool.vercel]
entrypoint = "src.cloud.api:app"

[tool.pytest.ini_options]
testpaths = ["tests/cloud"]
asyncio_mode = "auto"
